version: 1
intent: >
  Split this monorepo into 3 repos (CCEA Variant A) while keeping core trading/ML IP private.

defaults:
  # Only copy git-tracked files; exclusions are defense-in-depth.
  exclude_globs:
    - ".git/**"
    - ".github/**"          # new repos should have their own workflows
    - ".venv/**"
    - ".pytest_cache/**"
    - "**/__pycache__/**"
    - "**/*.pyc"
    - "**/*.pyd"
    - "**/*.so"
    - "**/*.dll"
    - "build/**"
    - "dist/**"
    - "artifacts/**"
    - "logs/**"
    - "state/**"
    - "data/**"
    - "reports/**"
    - "notebooks/**"
    - "archive/**"
    - "audits/**"

repos:
  ccea-sdk:
    visibility: public
    license_recommendation: "Apache-2.0"
    include_globs:
      # --- CCEA security substrate (safe to open-source) ---
      - "ccea/__init__.py"
      - "ccea/crypto/**"
      - "ccea/guardrails/**"
      - "ccea/artifact/**"
      - "ccea/contracts/**"
      - "ccea/models/**"
      - "ccea/protocol/**"
      - "ccea/schemas/**"

      # --- Schemas / contracts (public spec) ---
      - "docs/schemas/**"
      - "packages/shared/__init__.py"
      - "packages/shared/contracts/**"
      - "packages/shared/utils/**"
      - "packages/shared/models/**"
      - "packages/shared/adapters/**"
      - "packages/shared/runner/__init__.py"
      - "packages/shared/runner/base.py"

    # Keep SDK focused on verification/specs; artifact BUILD pipelines stay proprietary in Cloud.
    exclude_globs:
      - "ccea/artifact/builder.py"
      - "ccea/artifact/oci_builder.py"
      - "ccea/artifact/pipeline.py"
      - "ccea/artifact/registry.py"
      # Guardrails that require private Cloud/docs or are Cloud-specific.
      - "ccea/guardrails/tests/**"
      - "ccea/guardrails/build_artifact_check.py"
      - "ccea/guardrails/cloud_allowlist.py"
      - "ccea/guardrails/design_doc_check.py"
      - "ccea/guardrails/enterprise_posture_check.py"
      - "ccea/guardrails/intent_prohibition.py"
      - "ccea/guardrails/privacy_by_design_check.py"
      - "ccea/guardrails/protocol_review_check.py"
      - "ccea/guardrails/redaction_enforcement_check.py"
      - "ccea/guardrails/residency_check.py"
      - "ccea/guardrails/traceability_check.py"

    notes:
      - "Keep SDK minimal: protocol/specs/crypto/guardrails only; no RL, no backtest/sim engines."
      - "ccea/telemetry/** is intentionally excluded; agent has its own mandatory redaction implementation."

  ccea-agent:
    visibility: public
    license_recommendation: "Apache-2.0 or MIT"
    include_globs:
      - "packages/agent/**"
      - "configs/examples/agent.yaml"
    exclude_globs:
      # Keep OSS agent auditable; broker integrations/routing stay proprietary (plugins / private repos).
      - "packages/agent/broker/adapters/**"
      - "packages/agent/execution/router.py"
    notes:
      - "Agent will depend on ccea-sdk for contracts/schemas/crypto/guardrails after split."
      - "This monorepo currently references configs/agent.yaml in multiple docs, but the file is missing; fix in agent repo."

  ccea-cloud:
    visibility: private
    license_recommendation: "Proprietary (commercial EULA)"
    include_globs:
      # Cloud stack
      - "packages/cloud/**"
      - "deploy/**"
      - "docs/cloud/**"
      - "docs/compliance/**"
      - "docs/enterprise/**"
      - "docs/legal/**"
      - "docs/architecture/**"
      - "docs/ui/**"
      - "docs/operations/**"
      - "docs/runbooks/**"
      - "docs/security/**"
      - "docs/business/**"
      - "docs/design/**"
      - "docs/migration/**"
      - "docs/plans/**"

      # Core proprietary code (IP)
      - "services/**"
      - "adapters/**"
      - "strategies/**"
      - "optimizers/**"
      - "execution/**"
      - "lob/**"
      - "wrappers/**"
      - "utils/**"
      - "domain/**"
      - "api/**"
      - "backtest/**"
      - "benchmarks/**"
      - "scripts/**"
      - "config/**"
      - "configs/**"
      - "ccea/agent/**"           # deprecated legacy agent code (keep private)
      - "ccea/control_plane/**"   # legacy/prototype control plane (keep private)

      # Root-level core scripts/modules (IP / legacy runtime)
      - "*.py"
      - "*.pyx"
      - "*.pxd"
      - "*.cpp"
      - "*.h"
      - "*.json"
      - "*.md"
      - "*.yml"
      - "*.yaml"
      - "*.ini"
      - "Makefile"
      - "setup.py"
      - "pyproject.toml"

    notes:
      - "Cloud remains proprietary; only the CCEA substrate is open-source."
      - "If later you create a separate private 'ai-quant-core' repo, move training/sim/execution IP there and keep ccea-cloud as orchestration."

public_safety:
  # Defense-in-depth: patterns that must NEVER be present in public repos.
  forbidden_globs:
    - "distributional_ppo.py"
    - "train_model_*.py"
    - "script_live*.py"
    - "service_*.py"
    - "services/**"
    - "adapters/**"
    - "strategies/**"
    - "lob/**"
    - "optimizers/**"
    - "execution/**"
    # Agent-specific IP/integrations
    - "packages/agent/broker/adapters/**"
    - "packages/agent/execution/router.py"
  # Content-based checks (applied only to ccea-sdk and ccea-agent exports).
  # These are intentionally conservative: we forbid ML/training imports in OSS code.
  forbidden_content_regex:
    - "(?m)^\\s*(import|from)\\s+torch\\b"
    - "(?m)^\\s*(import|from)\\s+stable_baselines3\\b"
    - "(?m)^\\s*(import|from)\\s+sb3_contrib\\b"
    - "(?m)^\\s*(import|from)\\s+gymnasium\\b"
    - "\\bDistributionalPPO\\b"
    - "\\bcalculate_cvar\\b"
  guidance:
    - "Public repos may include protocol/schemas/crypto/guardrails/agent runtime only."
    - "All RL/training/backtest/simulation/execution modeling stays private."
