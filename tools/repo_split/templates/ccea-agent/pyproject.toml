[build-system]
requires = ["setuptools>=69.0.0,<70.0.0", "wheel>=0.42.0,<1.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ccea-agent"
version = "0.1.0"
description = "CCEA local execution agent (vault, sandbox, policy, telemetry redaction)"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12,<3.13"
authors = [{name = "CCEA Team"}]
keywords = ["agent", "security", "trading", "vault", "policy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "ccea-sdk>=0.1.0",
  "cryptography>=42.0.0,<44.0.0",
  "httpx>=0.26.0,<1.0.0",
  "pyyaml>=6.0.1,<7.0.0",
  "requests>=2.31.0,<3.0.0",
]

[project.optional-dependencies]
alpaca = ["alpaca-py>=0.20.0,<1.0.0"]
windows = ["psutil>=5.9.0,<6.0.0"]

[project.scripts]
ccea-agentd = "packages.agent.daemon.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*"]
