name: CI

on:
  push:
  pull_request:

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Compile
        run: python -m compileall -q ccea packages
      - name: Guardrails
        run: |
          python -m ccea.guardrails.schema_check docs/schemas/
          python -m ccea.guardrails.version_check
          python -m ccea.contracts.validation

