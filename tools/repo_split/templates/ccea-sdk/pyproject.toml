[build-system]
requires = ["setuptools>=69.0.0,<70.0.0", "wheel>=0.42.0,<1.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ccea-sdk"
version = "0.1.0"
description = "CCEA protocol/contracts, crypto, and artifact verification SDK"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12,<3.13"
authors = [{name = "CCEA Team"}]
keywords = ["security", "protocol", "contracts", "artifact-signing", "compliance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.5.0,<3.0.0",
  "cryptography>=42.0.0,<44.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ccea*", "packages*"]

[tool.setuptools.package-data]
"ccea.schemas" = ["*.json"]

